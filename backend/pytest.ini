[pytest]
# Only the real test suite. backend/scripts/ holds manual demo scripts that talk to real services.
testpaths = tests
norecursedirs = scripts samples .* __pycache__
pythonpath = .
addopts = -ra
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
markers =
    slow: DSP tests that take more than a second
